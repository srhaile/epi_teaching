project:
  type: book

book:
  title: "Short Tutorial on R and Biostatistics"
  subtitle: "Biostatistics Material for: Evidence-Based Coaching of Core Competencies in Epidemiology using the Framework of Randomized Controlled Trials"
  author: "Sarah Haile"
  date: today
  license: "CC BY"
  search: true
  page-navigation: false
  repo-url: https://github.com/srhaile/epi_teaching
  downloads: [pdf]
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Statistical Methods"
      chapters:
        - continuous.qmd
        - significance.qmd
        - binary.qmd
        - choice.qmd
    - part: "Analysis in R"
      chapters:
        - firststepsR.qmd
        - datachecking.qmd
        - datacleaning.qmd
        - visualization.qmd
        - testing.qmd
        - import.qmd
    - summary.qmd
    - future.qmd
    - references.qmd

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
  pdf:
    documentclass: scrbook

execute:
  freeze: auto
  
editor: source
code-link: true
code-fold: show
code-tools:
    source: true
    toggle: false
    caption: none
code-copy: true
